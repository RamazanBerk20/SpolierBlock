<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SpolierBlock</title>
  <link rel="stylesheet" href="../options/base.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <p class="word">SpolierBlock</p>
      <label class="switch" title="Blocking on or off">
        <input type="checkbox" id="enabled" role="switch" aria-label="Blocking">
        <span class="track" aria-hidden="true"></span>
      </label>
    </header>

    <div class="page" id="page">
      <p class="count" id="status" aria-live="polite"><b id="count">0</b> <span id="count-label">covers on this page</span></p>
      <label class="pause" id="pause-row" hidden>
        <span id="pause-label">Pause on this site</span>
        <span class="switch"><input type="checkbox" id="pause" role="switch"><span class="track" aria-hidden="true"></span></span>
      </label>
      <label class="pause" id="bare-row" hidden>
        <span>Cover caption-less videos here</span>
        <span class="switch"><input type="checkbox" id="bare" role="switch"><span class="track" aria-hidden="true"></span></span>
      </label>
    </div>

    <div class="teach" id="teach" hidden>
      <button type="button" id="name-btn" class="wide"></button>
      <div id="pick" class="finder" hidden>
        <p id="pick-what"></p>
        <label for="pick-search" class="sr">Search for the work</label>
        <input type="search" id="pick-search" autocomplete="off" spellcheck="false" placeholder="Which work?">
        <p id="pick-msg" class="soft" aria-live="polite" hidden></p>
        <ul id="pick-results" class="results"></ul>
        <div id="pick-confirm" class="row" hidden><button type="button" id="pick-ok" class="primary" hidden>Add name</button><button type="button" id="pick-cancel" class="quiet">Cancel</button></div>
        <p id="pick-done" class="soft" role="status" aria-live="polite"></p>
      </div>
    </div>

    <div class="finder">
      <label for="search" class="sr">Search to mark a work</label>
      <input type="search" id="search" autocomplete="off" spellcheck="false" placeholder="I've seen…">
      <p id="search-msg" class="soft" aria-live="polite" hidden></p>
      <ul id="results" class="results"></ul>
    </div>

    <button type="button" id="settings" class="primary wide">All settings</button>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
